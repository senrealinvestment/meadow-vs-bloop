<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Sparkelody — Worlds 1-9 (ladder preview)</title>
  <!-- Same-origin default so a Vercel deploy of THIS branch IS the game (no jsDelivr).
       Sergio's production play pin is still 7179fc44 (old dual-renderer). This branch is the fix.
       Optional: ?t=<sha> loads that commit from jsDelivr. Bad pins (7179fc44 / 3337fad7) stay local. Not GREEN. -->
  <link rel="stylesheet" href="styles.css" id="css-main" />
  <link rel="stylesheet" href="art-hotswap.css" id="css-art" />
</head>
<body>
  <div id="app">
    <div id="art-loader" style="position:absolute;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:#6aaa5a;font-weight:800;font-family:sans-serif;">Loading Meadow…</div>
    <header class="top-bar">
      <h1 class="title">Sparkelody · World 1 Meadow</h1>
      <div class="hud-row">
        <div class="power-hud" id="power-hud" aria-label="Powers">
          <span class="power-chip star locked" id="chip-star" title="Star">⭐</span>
          <span class="power-chip ice locked" id="chip-ice" title="Ice">❄️</span>
          <span class="power-chip fire locked" id="chip-fire" title="Fire">🔥</span>
          <span class="power-chip leaf locked" id="chip-leaf" title="Leaf">🍃</span>
          <span class="power-chip wind locked" id="chip-wind" title="Wind">💨</span>
          <span class="power-chip water locked" id="chip-water" title="Water">💧</span>
          <span class="power-chip electric locked" id="chip-electric" title="Electric">⚡</span>
          <span class="power-chip shine locked" id="chip-shine" title="Shine">✨</span>
          <span class="power-chip melody locked" id="chip-melody" title="Melody">🎵</span>
        </div>
        <div class="mode-toggle" role="tablist" aria-label="Success mode">
          <button type="button" id="mode-confirm" class="mode-btn active" role="tab" aria-selected="true">Confirm</button>
          <button type="button" id="mode-match" class="mode-btn" role="tab" aria-selected="false">Pick word</button>
        </div>
      </div>
      <button type="button" class="btn-newgame" id="btn-newgame">New game</button>
    </header>

    <main class="view" id="view-overworld">
      <div class="world-wrap">
        <canvas id="world" class="art-wait" width="480" height="352" aria-label="Meadow overworld"></canvas>
        <div class="world-hint" id="world-hint">Arrows / WASD · bump to talk</div>
      </div>

      <div class="dialogue hidden" id="dialogue" role="dialog" aria-live="polite">
        <p class="dialogue-name" id="dialogue-name"></p>
        <p class="dialogue-text" id="dialogue-text"></p>
        <button type="button" class="btn-confirm btn-sm" id="btn-dialogue">OK</button>
      </div>

      <div class="dpad-wrap" style="display:flex;align-items:flex-end;justify-content:center;gap:0.75rem;">
      <div class="dpad" id="dpad" aria-label="D-pad">
        <button type="button" class="dpad-btn" data-dir="up" aria-label="Up">▲</button>
        <div class="dpad-mid">
          <button type="button" class="dpad-btn" data-dir="left" aria-label="Left">◀</button>
          <button type="button" class="dpad-btn" data-dir="right" aria-label="Right">▶</button>
        </div>
        <button type="button" class="dpad-btn" data-dir="down" aria-label="Down">▼</button>
      </div>
      <button type="button" class="dpad-btn dpad-interact" id="btn-interact" aria-label="Talk">💬</button>
      <button type="button" class="btn-wear locked" id="btn-wear" aria-label="Wear">WEAR</button>
      </div>
    </main>

    <main class="view hidden" id="view-fight">
      <div class="stage" id="stage">
        <div class="sky"></div>
        <div class="hills"></div>
        <div class="grass"></div>

        <div class="fight-meta">
          <div class="hit-pips" id="hit-pips" aria-label="Hits"></div>
          <div class="sandglass hidden" id="sandglass" aria-label="Timer">
            <div class="sand-fill" id="sand-fill"></div>
          </div>
        </div>

        <div class="actors">
          <div class="hero sparkelody art-sprite" id="hero" title="Sparkelody">
            <div class="cat-ear left"></div>
            <div class="cat-ear right"></div>
            <div class="cat-head">
              <div class="cat-eye left"></div>
              <div class="cat-eye right"></div>
              <div class="cat-nose"></div>
            </div>
            <div class="cat-body"></div>
            <div class="cat-tail"></div>
            <div class="cat-collar"><span class="cat-charm"></span></div>
            <div class="hero-label">Sparkelody</div>
          </div>

          <div class="chest hidden" id="chest" title="Treasure chest">
            <div class="chest-lid"></div>
            <div class="chest-box"></div>
            <div class="chest-lock"></div>
            <div class="chest-label">Chest</div>
          </div>

          <div class="bloop art-sprite" id="bloop" title="Foe" style="background-color:transparent">
            <div class="bloop-body">
              <div class="bloop-eye left"></div>
              <div class="bloop-eye right"></div>
              <div class="bloop-smile"></div>
            </div>
            <div class="bloop-label" id="foe-label">Bloop</div>
          </div>
        </div>

        <div class="fx" id="fx" aria-hidden="true"></div>
        <div class="flavor" id="flavor" aria-live="polite"></div>
      </div>

      <section class="power-picker hidden" id="power-picker" aria-label="Pick a power">
        <p class="prompt">Pick a power</p>
        <div class="power-choices" id="power-choices"></div>
      </section>

      <section class="read-panel" id="read-panel">
        <p class="prompt" id="prompt">Sound it out!</p>
        <div class="cvc-wrap" id="cvc-wrap">
          <div class="cvc-word" id="cvc-word" aria-live="polite">CAT</div>
        </div>

        <div class="controls" id="controls-confirm">
          <button type="button" class="btn-confirm" id="btn-confirm">Confirm ✓</button>
        </div>

        <div class="controls hidden" id="controls-match">
          <button type="button" class="word-tile" id="choice-a"></button>
          <button type="button" class="word-tile" id="choice-b"></button>
        </div>

        <p class="feedback" id="feedback" aria-live="assertive"></p>
        <button type="button" class="btn-flee" id="btn-flee">Back to meadow</button>
      </section>
    </main>

    <div class="win-overlay hidden" id="win-overlay">
      <div class="win-card">
        <p class="win-emoji">✨🏆✨</p>
        <h2 id="win-title">You did it!</h2>
        <p id="win-msg">Great reading!</p>
        <button type="button" class="btn-confirm" id="btn-replay">Back to meadow</button>
      </div>
    </div>
  </div>
  <script>
  (function(){
    var m = location.search.match(/[?&](w[2-9]|frost|ember|leaf|wind|tide|storm|harmony|story)=1/);
    var worlds = {
      w2:["world-frost","Loading Frost Path…","#90caf9","#0d47a1","Sparkelody · World 2 Frost Path"],
      frost:["world-frost","Loading Frost Path…","#90caf9","#0d47a1","Sparkelody · World 2 Frost Path"],
      w3:["world-ember","Loading Ember Grove…","#bf360c","#fff3e0","Sparkelody · World 3 Ember Grove"],
      ember:["world-ember","Loading Ember Grove…","#bf360c","#fff3e0","Sparkelody · World 3 Ember Grove"],
      w4:["world-leaf","Loading Leaf Hollow…","#2e7d32","#e8f5e9","Sparkelody · World 4 Leaf Hollow"],
      leaf:["world-leaf","Loading Leaf Hollow…","#2e7d32","#e8f5e9","Sparkelody · World 4 Leaf Hollow"],
      w5:["world-wind","Loading Windy Ridge…","#455a64","#eceff1","Sparkelody · World 5 Windy Ridge"],
      wind:["world-wind","Loading Windy Ridge…","#455a64","#eceff1","Sparkelody · World 5 Windy Ridge"],
      w6:["world-tide","Loading Tide Pools…","#0277bd","#e1f5fe","Sparkelody · World 6 Tide Pools"],
      tide:["world-tide","Loading Tide Pools…","#0277bd","#e1f5fe","Sparkelody · World 6 Tide Pools"],
      w7:["world-storm","Loading Storm Peak…","#311b92","#ede7f6","Sparkelody · World 7 Storm Peak"],
      storm:["world-storm","Loading Storm Peak…","#311b92","#ede7f6","Sparkelody · World 7 Storm Peak"],
      w8:["world-harmony","Loading Harmony Hill…","#f6c26b","#4a148c","Sparkelody · World 8 Harmony Hill"],
      harmony:["world-harmony","Loading Harmony Hill…","#f6c26b","#4a148c","Sparkelody · World 8 Harmony Hill"],
      w9:["world-story","Loading Story Gate…","#1a237e","#fff8e1","Sparkelody · World 9 Story Gate"],
      story:["world-story","Loading Story Gate…","#1a237e","#fff8e1","Sparkelody · World 9 Story Gate"]
    };
    if (m && worlds[m[1]]) {
      var w = worlds[m[1]];
      if (m[1]==="w2" || m[1]==="frost") window.MEADOW_START_FROST=true;
      window.MEADOW_START_WORLD = ({w2:"frost",frost:"frost",w3:"ember",ember:"ember",w4:"leaf",leaf:"leaf",w5:"wind",wind:"wind",w6:"tide",tide:"tide",w7:"storm",storm:"storm",w8:"harmony",harmony:"harmony",w9:"story",story:"story"})[m[1]] || "meadow";
      var app=document.getElementById("app");
      if (app) app.classList.add(w[0]);
      var n=document.getElementById("art-loader");
      if (n) { n.textContent=w[1]; n.style.background=w[2]; n.style.color=w[3]; }
      var title=document.querySelector(".title");
      if (title) title.textContent=w[4];
      var wrap=document.querySelector(".world-wrap");
      if (wrap) wrap.style.background=w[2];
    }
  })();
  </script>
  <script>
  (function(){
    var t = (location.search.match(/[?&]t=([0-9a-f]{7,40})/i) || [])[1];
    var bad = t && /^(7179fc44|3337fad7|abb35df|e67a272|ec1612a|f8cc728|602d866|fdb8141)/i.test(t);
    if (t && !bad) {
      var cdn = "https://cdn.jsdelivr.net/gh/senrealinvestment/meadow-vs-bloop@" + t + "/";
      window.MEADOW_JS_BASE = cdn;
      window.MEADOW_ASSET_BASE = cdn + "assets";
      var m = document.getElementById("css-main");
      var a = document.getElementById("css-art");
      if (m) m.href = cdn + "styles.css";
      if (a) a.href = cdn + "art-hotswap.css";
      var s = document.createElement("script");
      s.src = cdn + "app.js";
      s.setAttribute("data-base", cdn);
      document.body.appendChild(s);
      return;
    }
    window.MEADOW_JS_BASE = "./";
    window.MEADOW_ASSET_BASE = "assets";
    var s2 = document.createElement("script");
    s2.src = "app.js";
    s2.setAttribute("data-base", "./");
    document.body.appendChild(s2);
  })();
  </script>
</body>
</html>
